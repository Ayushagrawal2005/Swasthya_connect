# Koyeb Deployment Config — SwasthyaConnect ML Service (Python/Flask)
# Deploy at: https://app.koyeb.com
# Free tier: 2 of 2 free services

name: swasthya-ml

services:
  - name: ml
    type: web

    # Build from GitHub — root directory is services/ml
    git:
      branch: main
      build_command: pip install -r requirements.txt
      run_command: gunicorn --bind 0.0.0.0:8000 --workers 1 --timeout 120 --preload app:app

    # Koyeb uses port 8000
    ports:
      - port: 8000
        protocol: http

    # Health check
    health_checks:
      - http:
          path: /health
          port: 8000

    # Environment variables — set in Koyeb dashboard
    # Required secrets (add in Koyeb dashboard → Environment):
    # PORT=8000
    # GROQ_API_KEY=your_groq_key

    # Instance — free nano tier
    instance_type: nano

    regions:
      - sin  # Singapore — closest to India
