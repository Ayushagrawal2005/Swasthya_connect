# Koyeb Deployment Config — SwasthyaConnect Backend (Node.js)
# Deploy at: https://app.koyeb.com
# Free tier: 1 of 2 free services

name: swasthya-backend

services:
  - name: api
    type: web
    
    # Build from GitHub — root directory is services/api
    git:
      branch: main
      build_command: npm install
      run_command: npm start

    # Koyeb uses port 8000 by default
    ports:
      - port: 8000
        protocol: http

    # Health check — keeps service warm
    health_checks:
      - http:
          path: /health
          port: 8000

    # Environment variables — set in Koyeb dashboard
    # Required secrets (add in Koyeb dashboard → Environment):
    # PORT=8000
    # JWT_SECRET=healthcare-secret-key-change-in-production
    # FIREBASE_PROJECT_ID=swasthyaconnect-4bfa1
    # FIREBASE_DATABASE_URL=https://swasthyaconnect-4bfa1-default-rtdb.firebaseio.com
    # FIREBASE_STORAGE_BUCKET=swasthyaconnect-4bfa1.firebasestorage.app
    # GROQ_API_KEY=your_groq_key
    # FIREBASE_SERVICE_ACCOUNT_KEY=<base64 encoded serviceAccountKey.json>
    # OCR_SERVICE_URL=https://swasthya-connect-ocr.onrender.com

    # Instance — free nano tier
    instance_type: nano
    
    regions:
      - sin  # Singapore — closest to India
